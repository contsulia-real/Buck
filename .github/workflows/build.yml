name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all six targets
        run: bash ./gradlew chiseledBuild --no-daemon --no-parallel
      - uses: actions/upload-artifact@v4
        with:
          name: buck-jars
          path: |
            fabric/versions/*/build/libs/buck-fabric-*.jar
            forge/versions/*/build/libs/buck-forge-*.jar
            neoforge/versions/*/build/libs/buck-neoforge-*.jar
          if-no-files-found: error
